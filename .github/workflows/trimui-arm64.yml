name: Build TrimUI ARM64 fbdev test
on:
  workflow_dispatch:
  push:
    paths:
      - 'engine/gpu/src/raster/gles/display.rs'
      - '.github/workflows/trimui-arm64.yml'
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:bullseye
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install -y curl ca-certificates git build-essential pkg-config file
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build ARM64 binary
        run: cargo build --release --locked -p pocket-native
      - name: Inspect binary
        run: |
          file target/release/pocket-native
          ldd target/release/pocket-native || true
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pocket-native-trimui-fbdev-aarch64
          path: target/release/pocket-native
